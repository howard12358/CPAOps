[package]
name = "cpactl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
rpassword = "7"
tempfile = "3"
thiserror = "2"
tar = "0.4"
time = { version = "=0.3.36", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util"] }
toml = "0.8"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
temp-env = "0.3"
